dataset: dstc
group_source: vpd_multi
num_groups: 85
conda_env: stickr-select
mode: train

base_config: configs/structured_factorized/v6_00_minimal_core.yaml
group_bank: artifacts/style_shapes/groups/dstc/vpd_multi/group_bank.json
residual_bundle: artifacts/vigem/residuals/dstc_vpd_multi.pt
legacy_init_checkpoint_path: artifacts/style_shapes/init/dstc_seed2021.ckpt
init_checkpoint_path: artifacts/vigem/init/dstc_vpd_multi_seed2021.ckpt
permutation_manifest: artifacts/style_shapes/permutations/dstc_seed2021_ws4.json
output_dir: artifacts/vigem/pilot/dstc/vpd_multi_instance_residual

instance_score_weight: 0.3
instance_loss_weight: 0.3

model_overrides:
  gpus: 4
  train_data_path: data/train_pair.json
  val_data_path: data/validation_pair_with_cand.json
  test_data_path: data/validation_pair_with_cand.json
  test_with_cand: true
  candidate_eval_only: true
  factorized_train_mode: legacy_triplet
  train_same_proto_negatives: 1
  train_cross_proto_negatives: 1
  factorized_train_bank_refresh_steps: 0
  pl_root_dir: artifacts/vigem/pilot/dstc/vpd_multi_instance_residual/lightning
