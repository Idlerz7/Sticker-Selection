dataset: stickerchat
group_source: vpd_pack
num_groups: 384
conda_env: stickr-select
mode: train
base_config: configs/structured_factorized/stickerchat_v6_minimal_core.yaml
group_bank: artifacts/style_shapes/groups/stickerchat/vpd_pack/group_bank.json
init_checkpoint_path: artifacts/style_shapes/init/stickerchat_seed2021.ckpt
permutation_manifest: artifacts/style_shapes/permutations/stickerchat_dual_local_seed2021_ws8.json
output_dir: artifacts/style_shapes/pilot/stickerchat/vpd_pack_dual_local_negatives
negative_sampling:
  mode: stickerchat_same_pack_plus_vpd_top32
  seed: 2021
  pack_metadata_path: stickerchat/processed/sticker_metadata.json
  eligibility_manifest: artifacts/style_shapes/negative_sampling/stickerchat_same_pack_plus_vpd_top32/eligible_rows.json
model_overrides:
  gpus: 8
  train_data_path: stickerchat/processed/release_train_u_sticker_format_int.json
  per_epoch_eval_test_r10_path: stickerchat/processed/release_val_u_sticker_format_int_with_cand_same_pack_r10.json
  per_epoch_eval_test_r20_path: stickerchat/processed/release_val_u_sticker_format_int_with_cand_r20.json
  test_data_path: stickerchat/processed/release_test_u_sticker_format_int_with_cand_same_pack_r10.json
  factorized_train_bank_refresh_steps: 500
  pl_root_dir: artifacts/style_shapes/pilot/stickerchat/vpd_pack_dual_local_negatives/lightning
